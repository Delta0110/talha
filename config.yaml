# Talha Proje Yapılandırması / Talha Project Configuration

# Eğitim Parametreleri / Training Parameters
training:
  batch_size: 32
  learning_rate: 0.001
  num_epochs: 10
  train_split: 0.8
  validation_split: 0.1
  test_split: 0.1
  random_seed: 42
  device: "cpu"  # "cuda" veya "cpu"
  
# Model Parametreleri / Model Parameters
model:
  input_size: 784  # 28x28 MNIST görüntüleri için
  hidden_sizes:
    - 128
    - 64
  output_size: 10  # 0-9 rakamları
  dropout_rate: 0.2
  
# Optimizer Parametreleri / Optimizer Parameters
optimizer:
  name: "Adam"
  weight_decay: 0.0001
  
# Kayıt Parametreleri / Logging Parameters
logging:
  log_interval: 10  # Her kaç batch'te bir log
  save_interval: 5  # Her kaç epoch'ta bir model kaydet
  verbose: true
  
# Veri Parametreleri / Data Parameters
data:
  dataset: "MNIST"
  download: true
  num_workers: 2
  shuffle_train: true
  pin_memory: false
